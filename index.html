<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Code Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/react-live@4.1.7/dist/react-live.umd.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #050505; color: #F5F5F5; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* CodeMirror / textarea editor */
    #code-editor {
      width: 100%;
      height: 100%;
      background: #0D0D0D;
      color: #F5F5F5;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      border: none;
      outline: none;
      padding: 16px;
      resize: none;
      tab-size: 2;
    }

    /* react-live overrides */
    .prism-code {
      background: #0D0D0D !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 13px !important;
      line-height: 1.6 !important;
      padding: 16px !important;
      min-height: 100% !important;
      outline: none !important;
    }

    .live-error {
      background: #1a0000;
      color: #FF3B30;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 10px 16px;
      border-top: 1px solid #2A2A2A;
      white-space: pre-wrap;
    }

    .cursor-blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: 0 } }

    .slide-up { animation: slideUp 0.15s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #050505; }
    ::-webkit-scrollbar-thumb { background: #2A2A2A; }
    ::-webkit-scrollbar-thumb:hover { background: #3A3A3A; }

    /* Chat bubble */
    .msg-bubble { animation: slideUp 0.15s ease-out; }
  </style>
</head>

          <div ref={scrollRef} style={{flex:1,overflowY:'auto',padding:'20px',display:'flex',flexDirection:'column',gap:'20px',minHeight:0}}>
            {messages.length === 0 && !generating && (
              <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',textAlign:'center',padding:'24px'}}>
                <div style={{color:'#FFCC00',marginBottom:'16px'}}>✦</div>
                <h3 style={{fontWeight:'700',fontSize:'18px',letterSpacing:'-0.02em'}}>Describe your app</h3>
                <p style={{fontSize:'13px',color:'#A1A1AA',marginTop:'8px',lineHeight:'1.6',maxWidth:'220px'}}>Be specific about layout and styling. The AI will render it live.</p>
                <div style={{marginTop:'24px',display:'flex',flexDirection:'column',gap:'8px',width:'100%'}}>
                  {SUGGESTIONS.map(s => (
                    <button key={s} onClick={() => handleSend(s)} className="mono" style={{textAlign:'left',fontSize:'12px',color:'#A1A1AA',border:'1px solid #2A2A2A',background:'transparent',cursor:'pointer',padding:'10px 12px',color:'#A1A1AA',transition:'all 0.1s'}}
                      onMouseEnter={e=>{e.target.style.borderColor='#FF3B30';e.target.style.color='#F5F5F5'}}
                      onMouseLeave={e=>{e.target.style.borderColor='#2A2A2A';e.target.style.color='#A1A1AA'}}>
                      → {s}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {messages.map(msg => (
              <div key={msg.id} className="msg-bubble" style={{display:'flex',gap:'12px'}}>
                <div style={{width:'28px',height:'28px',background:msg.role==='user'?'#F5F5F5':'#FF3B30',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  {msg.role==='user' ? <span style={{color:'#050505'}}><IconUser/></span> : <span style={{color:'#050505'}}><IconSpark/></span>}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div className="mono" style={{fontSize:'10px',textTransform:'uppercase',letterSpacing:'0.2em',marginBottom:'8px',color:msg.role==='user'?'#A1A1AA':'#FF3B30'}}>/ {msg.role}</div>
                  <div style={{fontSize:'14px',lineHeight:'1.6',wordBreak:'break-word'}}>{msg.content}</div>
                  {msg.hasCode && <div className="mono" style={{marginTop:'8px',display:'inline-flex',alignItems:'center',gap:'6px',fontSize:'10px',textTransform:'uppercase',letterSpacing:'0.2em',color:'#FFCC00',border:'1px solid #2A2A2A',padding:'4px 8px'}}><IconCode/> code generated</div>}
                </div>
              </div>
            ))}

            {generating && (
              <div className="msg-bubble" style={{display:'flex',gap:'12px'}}>
                <div style={{width:'28px',height:'28px',background:'#FF3B30',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  <span style={{color:'#050505'}}><IconSpark/></span>
                </div>
                <div style={{flex:1}}>
                  <div className="mono" style={{fontSize:'10px',textTransform:'uppercase',letterSpacing:'0.2em',marginBottom:'8px',color:'#FF3B30'}}>/ assistant</div>
                  <div className="mono" style={{fontSize:'13px',color:'#A1A1AA'}}>▓▓▓▓▓░░░░░ thinking<span className="cursor-blink"> █</span></div>
                </div>
              </div>
            )}
          </div>

          {/* Input */}
          <form onSubmit={e=>{e.preventDefault();handleSend(input);}} style={{borderTop:'1px solid #2A2A2A',padding:'16px',flexShrink:0,background:'#050505'}}>
            <div style={{border:'1px solid #2A2A2A',background:'#0D0D0D',display:'flex',alignItems:'flex-end',gap:'8px',padding:'8px'}}>
              <textarea
                value={input}
                onChange={e=>setInput(e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend(input);}}}
                disabled={generating}
                placeholder="Describe what to build..."
                rows={2}
                className="mono"
                style={{flex:1,background:'transparent',color:'#F5F5F5',border:'none',outline:'none',resize:'none',padding:'4px 8px',fontSize:'13px',lineHeight:'1.5',opacity:generating?0.5:1}}
              />
              <button type="submit" disabled={generating||!input.trim()} style={{background:'#FF3B30',border:'none',color:'#F5F5F5',padding:'10px',cursor:'pointer',flexShrink:0,opacity:(generating||!input.trim())?0.3:1}}>
                <IconSend/>
              </button>
            </div>
            <div className="mono" style={{marginTop:'8px',fontSize:'10px',textTransform:'uppercase',letterSpacing:'0.2em',color:'#52525B'}}>enter to send · shift+enter for newline</div>
          </form>
        </div>

        {/* Preview Panel */}
        <div style={{display:'flex',flexDirection:'column',minHeight:0,background:'#050505'}}>
          {/* Tabs */}
          <div style={{display:'flex',alignItems:'center',borderBottom:'1px solid #2A2A2A',flexShrink:0}}>
            {[{id:'preview',icon:<IconEye/>,label:'preview'},{id:'code',icon:<IconCode/>,label:'code'}].map(t => (
              <button key={t.id} onClick={()=>setTab(t.id)} className="mono"
                style={{padding:'12px 20px',fontSize:'10px',textTransform:'uppercase',letterSpacing:'0.2em',display:'flex',alignItems:'center',gap:'8px',borderRight:'1px solid #2A2A2A',cursor:'pointer',background:tab===t.id?'#121212':'transparent',color:tab===t.id?'#FF3B30':'#A1A1AA',border:tab===t.id?'none':'none',borderRight:'1px solid #2A2A2A',borderBottom:tab===t.id?'2px solid #FF3B30':'2px solid transparent',marginBottom:tab===t.id?'-1px':0,transition:'all 0.1s'}}>
                {t.icon} {t.label}
              </button>
            ))}
            <div style={{flex:1}}/>
            <button onClick={copyCode} className="mono" style={{padding:'12px 16px',fontSize:'10px',textTransform:'uppercase',letterSpacing:'0.2em',display:'flex',alignItems:'center',gap:'6px',cursor:'pointer',background:'transparent',border:'none',color:copied?'#34C759':'#A1A1AA'}}>
              {copied ? <><IconCheck/> copied</> : <><IconCopy/> copy</>}
            </button>
          </div>

          <div style={{flex:1,overflow:'hidden',minHeight:0,position:'relative'}}>
            {window.ReactLive ? (() => {
              const { LiveProvider, LivePreview, LiveError, LiveEditor } = window.ReactLive;
              return (
                <LiveProvider code={code} scope={{React}} noInline={true}>
                  {tab === 'preview' ? (
                    <div style={{height:'100%',overflowY:'auto',background:'white',color:'black'}}>
                      <LivePreview />
                      <LiveError className="live-error" />
                    </div>
                  ) : (
                    <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#0D0D0D'}}>
                      <div style={{flex:1,overflow:'auto'}}>
                        <LiveEditor onChange={val=>{setCode(val);setEditorCode(val);}} style={{minHeight:'100%'}} />
                      </div>
                      <LiveError className="live-error" />
                    </div>
                  )}
                </LiveProvider>
              );
            })() : (
              <div style={{padding:'32px',color:'#A1A1AA',fontFamily:'monospace',fontSize:'13px'}}>Loading react-live…</div>
            )}
          </div>
        </div>

      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
